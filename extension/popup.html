<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="card">
      <h1>NaviParty</h1>
      <label>
        Server URL
        <input id="serverUrl" type="text" placeholder="ws://localhost:3000/ws" />
      </label>
      <label>
        Room ID
        <input id="roomId" type="text" placeholder="my-room" />
      </label>
      <div class="actions">
        <button id="connect">Connect</button>
        <button id="disconnect" class="secondary">Disconnect</button>
      </div>
      <div class="status" id="status">Disconnected</div>
      <div class="status" id="host">Host: no</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
